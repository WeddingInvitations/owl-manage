<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba local de reservas</title><link rel="stylesheet" href="/public-reservas/css/styles.css"><link rel="stylesheet" href="/public-reservas/css/booking.css"></head>
<body>
<p>Prueba local con datos ficticios y llamadas simuladas. No conecta a Firebase.</p>
<div id="familyTabs"><button class="family-tab" data-family="pilates">Pilates</button><button class="family-tab" data-family="barre">Barre</button></div>
<section id="bookingContent"></section><div id="toast"></div>
<script>
window.testCalls = { schedule: 0, book: 0, cancel: 0 };
window.testAuth = { currentUser: { uid: 'local-test-user' } };
window.testFixtures = new Map();
window.testAdmin = new URLSearchParams(location.search).has('admin');
window.testUnpaid = new URLSearchParams(location.search).has('unpaid');
window.testBookingErrors = {};
window.testBookingAttempts = [];
window.testCall = async (name, data) => {
  const delay = () => new Promise(resolve => setTimeout(resolve, 60));
  if (name === 'getNestBookingSchedule') {
    window.testCalls.schedule++;
    await delay();
    const sessions = [];
    for (let date = new Date(data.startDate + 'T12:00:00'); date <= new Date(data.endDate + 'T12:00:00'); date.setDate(date.getDate()+1)) {
      if (date.getDay() === 0 || date.getDay() === 6) continue;
      const dateKey = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
      for (const hour of [18, 19]) {
        const id = `${data.family}__${dateKey}__slot-${hour}`;
        const start = new Date(date); start.setHours(hour, 0, 0, 0);
        const session = { id, dateKey, slotId: `slot-${hour}`, startTime: `${hour}:00`, endTime: `${hour+1}:00`, startTimestamp: start.toISOString(), capacity: 6, reservedCount: 0, attendees: [], monthlyUsed: 0, monthlyLimit: 4, activeForMonth: true, canBook: start > new Date(), past: start <= new Date() };
        if (window.testUnpaid && !window.testAdmin) {
          session.activeForMonth = false;
          session.actionsBlocked = true;
          session.canBook = false;
          session.canCancel = false;
          session.isBooked = hour === 18;
          session.reservedCount = hour === 18 ? 1 : 0;
        }
        if (window.testAdmin) {
          session.canManageRoster = true;
          session.canBookForOthers = true;
          session.canRemoveOthers = start > new Date();
          session.attendees = [{ id: `${id}__already-booked`, athleteId: 'already-booked', name: 'Alumna con plaza', paymentPending: window.testUnpaid }];
          session.reservedCount = 1;
        }
        sessions.push(window.testFixtures.get(id) || session);
        if (!window.testFixtures.has(id)) window.testFixtures.set(id, session);
      }
    }
    return { data: { sessions, memberPhotos: {} } };
  }
  if (name === 'getNestBookingAthletes') {
    return { data: { athletes: [
      { id: 'already-booked', name: 'Alumna con plaza', email: 'reserved@example.com', paymentPending: window.testUnpaid },
      { id: 'ana', name: 'Ana García', email: 'ana@example.com', paymentPending: window.testUnpaid },
      { id: 'bea', name: 'Beatriz López', email: 'bea@example.com', paymentPending: false },
      { id: 'carla', name: 'Carla Pérez', email: 'carla@example.com', paymentPending: false },
      { id: 'diana', name: 'Diana Ruiz', email: 'diana@example.com', paymentPending: false },
      { id: 'elena', name: 'Elena Martín', email: 'elena@example.com', paymentPending: false },
      { id: 'fatima', name: 'Fátima Díaz', email: 'fatima@example.com', paymentPending: false },
    ] } };
  }
  const id = `${data.family}__${data.dateKey}__${data.slotId}`;
  if (name === 'getNestClassRoster') return { data: { attendees: window.testFixtures.get(id)?.attendees || [] } };
  if (name === 'bookNestClass') {
    window.testLastBooking = data;
    window.testCalls.book++; await delay();
    window.testBookingAttempts.push(data.athleteId || 'local-athlete');
    if (window.testBookingErrors[data.athleteId]) {
      const error = new Error(window.testBookingErrors[data.athleteId]);
      error.code = 'functions/failed-precondition';
      throw error;
    }
    const attendee = { id: `${id}__${data.athleteId || 'local-athlete'}`, athleteId: data.athleteId || 'local-athlete',
      name: data.athleteId === 'ana' ? 'Ana García' : 'Alumna ficticia', isCurrentUser: !window.testAdmin,
      ...(window.testAdmin ? { paymentPending: window.testUnpaid && data.athleteId !== 'bea' } : {}) };
    const fixture = window.testFixtures.get(id);
    fixture.attendees.push(attendee);
    fixture.reservedCount++;
    return { data: { success: true, sessionId: id, reservedCount: fixture.reservedCount, capacity: 6, monthlyUsed: 1, monthlyLimit: 4, attendee } };
  }
  if (name === 'cancelNestBooking') {
    window.testLastCancellation = data;
    window.testCalls.cancel++; await delay();
    const fixture = window.testFixtures.get(id);
    fixture.attendees = fixture.attendees.filter((attendee) => attendee.athleteId !== (data.athleteId || 'local-athlete'));
    fixture.reservedCount = Math.max(0, fixture.reservedCount - 1);
    return { data: { success: true, sessionId: id, reservedCount: fixture.reservedCount, monthlyUsed: 0, athleteId: data.athleteId || 'local-athlete' } };
  }
  throw new Error('Unexpected callable: ' + name);
};
</script>
<script type="module">
import { showBookingFamily } from '/public-reservas/js/booking.js';
window.testShowFamily = showBookingFamily;
await showBookingFamily('pilates');
window.testReady = true;
</script>
</body></html>
