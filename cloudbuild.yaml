steps:
  - id: validate-and-install-functions
    name: node:22-bookworm
    entrypoint: bash
    args:
      - -ceu
      - |
        node --test functions/nest-booking/admin-schedule.test.js
        node --check functions/index.js
        node --check functions/nest-booking/index.js
        node --check public-reservas/js/app.js
        node --check public-reservas/js/booking.js
        npm ci --prefix functions --no-audit --no-fund

  # Firebase CLI uses Application Default Credentials from the build service account.
  # Explicit project/targets avoid relying on an interactive Firebase login or alias.
  - id: deploy-firestore
    name: node:22-bookworm
    entrypoint: bash
    args: ["scripts/deploy-firebase.sh", "firestore"]

  - id: deploy-functions
    name: node:22-bookworm
    entrypoint: bash
    args: ["scripts/deploy-firebase.sh", "functions"]

  - id: deploy-hosting
    name: node:22-bookworm
    entrypoint: bash
    args: ["scripts/deploy-firebase.sh", "hosting:owlmanage,hosting:nest-reservas"]

  - id: verify-published-hosting
    name: node:22-bookworm
    entrypoint: node
    args: ["scripts/verify-hosting.mjs"]

  # Keep publishing the existing OwlManage App Engine endpoint too.
  - id: deploy-app-engine
    name: gcr.io/cloud-builders/gcloud
    args: ["app", "deploy", "app.yaml", "--quiet"]

timeout: "3600s"
options:
  logging: CLOUD_LOGGING_ONLY
